function hlLine(line, lang) {
  // tokenise strings and comments, escape everything
  let out = "", i = 0, inStr = false, buf = "";
  const flush = cls => { if (buf) { out += cls ? `<span class="${cls}">${esc(buf)}</span>` : esc(buf); buf = ""; } };
  while (i < line.length) {
    const c = line[i];
    if (!inStr && c === "#" && (lang === "hcl" || /\s/.test(line[i - 1] || " "))) { flush(); buf = line.slice(i); flush("k-com"); return out; }
    if (c === '"') { if (inStr) { buf += c; flush("k-str"); inStr = false; i++; continue; } flush(); inStr = true; }
    buf += c; i++;
  }
  flush(inStr ? "k-str" : "");
  return out;
}
function highlight(code, lang) {
  return code.split("\n").map(line => {
    if (lang === "hcl") return hlLine(line, "hcl").replace(/^(\s*)(resource|data|variable|output|provider|module|terraform|locals|import|removed|ephemeral|backend|cloud|lifecycle|workspaces|required_providers)\b/, '$1<span class="k-kw">$2</span>');
    const t = line.trimStart();
    if (t.startsWith("$ ")) return `<span class="k-cmd">${esc(line)}</span>`;
    if (/^[\u2577\u2502\u2575]/.test(t) || /Error:/.test(line)) return `<span class="k-err">${esc(line)}</span>`;
    if (/^(Success!|Apply complete!|Destroy complete!|Import successful!|No changes\.|Terraform has created|Successfully)/.test(t)) return `<span class="k-ok">${esc(line)}</span>`;
    if (/^(\+|-\/\+)\s/.test(t)) return `<span class="k-add">${esc(line)}</span>`;
    if (/^-\s/.test(t)) return `<span class="k-del">${esc(line)}</span>`;
    if (/^~\s/.test(t)) return `<span class="k-chg">${esc(line)}</span>`;
    return hlLine(line, "sh");
  }).join("\n");
}
const guessLang = s => /^\s*(resource|data|provider|variable|output|module|terraform|import|locals)\b|=\s*\{|\{\s*$/m.test(s) && !/^\s*\$ /m.test(s) && !/^Error:/m.test(s) ? "hcl" : "sh";
const codeBox = (s, lang, extra) => `<pre class="code${extra ? " " + extra : ""}">${highlight(s, lang || guessLang(s))}</pre>`;

function optHTML(q, i, where) {
  const s = st(q.n), letter = L(i), txt = q.opts[i];
  let cls = "opt";
  if (s.done || s.revealed) {
    if (q.ans.includes(letter)) cls += " ok"; else if (s.picked.includes(letter)) cls += " bad";
  } else if (s.picked.includes(letter)) cls += " pick";
  const body = txt.includes("\n") ? codeBox(txt, "hcl") : esc(txt);
  return `<li><button class="${cls}" data-n="${q.n}" data-l="${letter}" data-where="${where}"><span class="l">${letter}</span><span class="tx">${body}</span></button></li>`;
}
function footHTML(q, where) {
  const s = st(q.n), k = need(q);
  if (s.done) return `<span class="verdict ${s.ok ? "ok" : "bad"}">${icon(s.ok ? "check" : "x")}${s.ok ? "Correct" : "Not quite"}</span><button class="btn ghost" data-retry="${q.n}" title="Try again">${icon("retry")}</button>`;
  if (k > 1) return `<button class="btn" data-check="${q.n}" ${s.picked.length === k ? "" : "disabled"}>${icon("check")} ${s.picked.length}/${k}</button>`;
  return `<span style="color:var(--muted);font-style:italic">pick one</span>`;
}
function headHTML(q) {
  const w = S.wrong[q.n] || 0, m = !!S.mastered[q.n];
  return `<div class="qn"><small>Q</small>${q.n}</div>
    <div class="kicks"><span class="kicker">${icon(q.topic)}${TOPICS[q.topic]}</span><span class="type ${tcls(q.type)}">${q.type}</span></div>
    <div class="badges">${m ? `<span class="badge m" title="Mastered">${icon("star")}</span>` : ""}${w ? `<span class="badge w" title="Times wrong">${icon("x")}${w}</span>` : ""}</div>`;
}
function cardHTML(q, idx) {
  const tilt = ((q.n * 37) % 9 - 4) * 0.25, tape = ((q.n * 13) % 11 - 5);
  return `<article class="card${S.sel === q.n ? " sel" : ""}${S.mastered[q.n] ? " mastered" : ""}" id="q${q.n}" data-n="${q.n}" style="--tilt:${tilt}deg;--tape:${tape}deg;--tapec:${TAPES[q.n % 4]}">
    <div class="chead">${headHTML(q)}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.ex ? codeBox(q.ex, null, "ex") : ""}
    <ol class="opts">${q.opts.map((_, i) => optHTML(q, i, "card")).join("")}</ol>
    <div class="cfoot">${footHTML(q, "card")}</div>
  </article>`;
}
function visible() {
  return order.map(n => byN[n]).filter(q =>
    (!S.topic || q.topic === S.topic) &&
    (S.filter === "all" || (S.filter === "todo" && !S.mastered[q.n]) || (S.filter === "wrong" && (S.wrong[q.n] || 0) > 0)));
}
function renderGrid() {
  const v = visible();
  document.getElementById("grid").innerHTML = v.length ? v.map(cardHTML).join("") : `<div class="empty">Nothing here. Every question in this filter is mastered.</div>`;
  document.getElementById("count").textContent = `${v.length} shown`;
}
function renderPanel() {
  const p = document.getElementById("panel"), q = byN[S.sel];
  if (!q) { p.innerHTML = `<div class="pempty"><span class="qn">${QS.length}</span>questions I keep getting wrong.<br>Pick a card to open its story.</div>`; return; }
  const s = st(q.n), show = !S.practice || s.done || s.revealed;
  const sents = q.why.split(/(?<=\.)\s/); const take = sents[0].length < 40 && sents[1] ? sents[0] + " " + sents[1] : sents[0];
  const ansTxt = q.ans.map(a => `<li><button class="opt ok" tabindex="-1"><span class="l">${a}</span><span class="tx">${q.opts[a.charCodeAt(0) - 65].includes("\n") ? codeBox(q.opts[a.charCodeAt(0) - 65], "hcl") : esc(q.opts[a.charCodeAt(0) - 65])}</span></button></li>`).join("");
  const blocks = q.blocks.map(([lang, code]) => `<div class="blab">${icon(lang === "hcl" ? "hcl" : "term")}${lang === "hcl" ? "HCL" : "Terminal"}</div>${codeBox(code, lang)}`).join("");
  p.innerHTML = `<div class="ph">${headHTML(q)}<div class="tools">
      <button class="ib${S.mastered[q.n] ? " on" : ""}" data-master="${q.n}" title="Toggle mastered">${icon("star")}</button>
      <button class="ib" data-close="1" title="Collapse panel">${icon("panel")}</button></div></div>
    <div class="pb">
      <p class="qtext">${esc(q.q)}</p>
      ${q.ex ? codeBox(q.ex, null, "ex") : ""}
      <ol class="opts">${q.opts.map((_, i) => optHTML(q, i, "panel")).join("")}</ol>
      <div class="cfoot">${footHTML(q, "panel")}</div>
      ${show ? `
      <div class="sec"><h3>${icon("check")}Answer</h3><ol class="opts answer">${ansTxt}</ol></div>
      <blockquote class="pull">${esc(take)}</blockquote>
      <div class="sec"><h3>${icon("book")}Why</h3><p class="expl">${esc(q.why)}</p></div>
      <div class="sec"><h3>${icon("x")}Why not the others</h3><ul class="wrongs">${Object.entries(q.wrong).map(([l, t]) => `<li><span class="l">${l}</span><span>${esc(t)}</span></li>`).join("")}</ul></div>
      ${q.debate ? `<div class="sec"><h3>${icon("warn")}Debatable</h3><div class="debate">${icon("warn")}<span>${esc(q.debate)}</span></div></div>` : ""}
      <div class="sec"><h3>${icon("term")}Simulated situation</h3><p class="story">${esc(q.story)}</p>${blocks}</div>
      ${q.related.length ? `<div class="sec"><h3>${icon("link")}Twins &amp; cousins</h3><div class="rel">${q.related.map(r => `<button class="chip" data-go="${r}">${icon(byN[r].topic)}Q${r} · ${esc(byN[r].title)}</button>`).join("")}</div></div>` : ""}
      ` : `<div class="sec"><div class="veil"><p>Practice mode: answer first, or peek.</p><button class="btn" data-reveal="${q.n}">${icon("eye")} Reveal</button></div></div>`}
    </div>`;
  p.scrollTop = 0;
}
function renderBar() {
  const m = QS.filter(q => S.mastered[q.n]).length;
  document.getElementById("pfill").style.width = (100 * m / QS.length) + "%";
  document.getElementById("ptxt").textContent = `${m}/${QS.length}`;
  document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === S.filter));
  document.getElementById("practice").classList.toggle("on", S.practice);
  document.getElementById("ptoggle").classList.toggle("on", S.panelOpen);
  document.body.classList.toggle("pclosed", !S.panelOpen);
  document.getElementById("topic").value = S.topic;
  document.getElementById("issueMeta").textContent = `${QS.length} questions · ${Object.keys(TOPICS).length} topics`;
}
function renderAll() { renderBar(); renderGrid(); renderPanel(); }
function refreshOne(n) {
  const q = byN[n], el = document.getElementById("q" + n);
  if (el) { const tmp = document.createElement("div"); tmp.innerHTML = cardHTML(q); el.replaceWith(tmp.firstElementChild); }
  if (S.sel === n) renderPanel();
  renderBar();
}
function select(n, scroll) {
  const prev = S.sel; S.sel = n; S.panelOpen = true; save();
  [prev, n].forEach(x => { const el = document.getElementById("q" + x); if (el) el.classList.toggle("sel", x === n); });
  renderBar(); renderPanel();
  if (scroll) { const el = document.getElementById("q" + n); if (el) el.scrollIntoView({behavior: "smooth", block: "center"}); }
}
function grade(n) {
  const q = byN[n], s = st(n);
  s.done = true;
  s.ok = s.picked.length === q.ans.length && q.ans.every(a => s.picked.includes(a));
  if (s.ok) S.mastered[n] = true; else { S.wrong[n] = (S.wrong[n] || 0) + 1; delete S.mastered[n]; }
  save(); refreshOne(n);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, .card");
  if (!t) return;
  if (t.matches(".opt[data-l]")) {
    const n = +t.dataset.n, q = byN[n], s = st(n), l = t.dataset.l;
    if (s.done || s.revealed) { if (S.sel !== n) select(n); return; }
    if (S.sel !== n) select(n);
    if (need(q) === 1) { s.picked = [l]; grade(n); return; }
    s.picked = s.picked.includes(l) ? s.picked.filter(x => x !== l) : (s.picked.length < need(q) ? [...s.picked, l] : s.picked);
    refreshOne(n); return;
  }
  if (t.dataset.check) return grade(+t.dataset.check);
  if (t.dataset.retry) { const n = +t.dataset.retry; session[n] = {picked:[], done:false, ok:false, revealed:false}; return refreshOne(n); }
  if (t.dataset.reveal) { const n = +t.dataset.reveal; st(n).revealed = true; return refreshOne(n); }
  if (t.dataset.master) { const n = +t.dataset.master; if (S.mastered[n]) delete S.mastered[n]; else S.mastered[n] = true; save(); return refreshOne(n); }
  if (t.dataset.close) { S.panelOpen = false; save(); return renderBar(); }
  if (t.dataset.go) {
    const n = +t.dataset.go;
    if (!document.getElementById("q" + n)) { S.filter = "all"; S.topic = ""; save(); renderGrid(); }
    return select(n, true);
  }
  if (t.dataset.f) { S.filter = t.dataset.f; save(); renderBar(); return renderGrid(); }
  if (t.id === "shuffle") { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } return renderGrid(); }
  if (t.id === "order") { order = QS.map(q => q.n); return renderGrid(); }
  if (t.id === "practice") { S.practice = !S.practice; save(); renderBar(); return renderPanel(); }
  if (t.id === "ptoggle") { S.panelOpen = !S.panelOpen; save(); return renderBar(); }
  if (t.id === "reset") { if (confirm("Reset mastered flags and wrong counts?")) { S.mastered = {}; S.wrong = {}; save(); renderAll(); } return; }
  if (t.classList.contains("card")) select(+t.dataset.n);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.panelOpen) { S.panelOpen = false; save(); renderBar(); } });
const sel = document.getElementById("topic");
sel.innerHTML = `<option value="">All topics</option>` + Object.entries(TOPICS).map(([k, v]) => `<option value="${k}">${v} (${QS.filter(q => q.topic === k).length})</option>`).join("");
sel.addEventListener("change", () => { S.topic = sel.value; save(); renderGrid(); });
if (S.sel && !byN[S.sel]) S.sel = null;
renderAll();
</script>
</body>
</html>
