<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraform 004 · The Weak Spots Issue</title>
<style>
:root{
  --cream:#d9cfba; --paper:#ece3cf; --ink:#1d1b18; --ink2:#4a443b; --muted:#857b6b;
  --terra:#c4623f; --jade:#3f7f5f; --sky:#6f9fc8; --mustard:#e0a92e; --rule:#cdbf9f;
  --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --body:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:"Helvetica Neue","Avenir Next",Arial,system-ui,sans-serif;
  --cond:"Oswald","Bebas Neue","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",ui-monospace,monospace;
  --pw:clamp(380px,36vw,640px);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--body);background:var(--cream)}
.bg{position:fixed;inset:0;z-index:-1;background:var(--cream) url("assets/greatwall-wide.jpg") center/cover no-repeat}
@media (orientation:portrait),(max-aspect-ratio:1/1){.bg{background-image:url("assets/greatwall-portrait.jpg")}}
.bg{filter:brightness(.72) saturate(.85)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,32,22,.28),rgba(40,32,22,.18) 40%,rgba(40,32,22,.32))}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}

/* masthead */
.mast{margin:18px auto 0;max-width:1880px;padding:14px 28px 10px;background:rgba(236,227,207,.94);border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);box-shadow:0 6px 18px rgba(60,40,10,.12);position:relative}
.mast .kick{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-variant:small-caps;letter-spacing:.14em;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:6px;flex-wrap:wrap}
.mast h1{margin:6px 0 0;font-family:var(--serif);font-weight:700;font-size:clamp(40px,6.4vw,104px);line-height:.9;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.25em;flex-wrap:wrap}
.mast h1 .num{color:var(--terra);font-style:italic}
.mast h1 .sub{font-size:.36em;font-style:italic;font-weight:400;color:var(--jade);letter-spacing:0}
.mast .stamp{position:absolute;right:28px;bottom:16px;transform:rotate(6deg);border:2px dashed var(--terra);color:var(--terra);padding:6px 12px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:14px;background:rgba(253,248,236,.8)}

/* toolbar */
.bar{position:sticky;top:0;z-index:40;max-width:1880px;margin:0 auto;padding:8px 28px;background:rgba(29,27,24,.94);color:var(--paper);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--sans);font-size:13px}
.prog{display:flex;align-items:center;gap:8px;min-width:200px;flex:1 1 220px}
.prog .track{flex:1;height:8px;background:#3d3830;border-radius:8px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--jade),var(--mustard));transition:width .4s}
.prog b{font-family:var(--mono);font-size:12px;white-space:nowrap}
.seg{display:flex;background:#3d3830;border-radius:8px;padding:2px}
.ib{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 9px;border-radius:6px;color:var(--paper)}
.ib:hover{background:#565046}
.ib.on{background:var(--mustard);color:var(--ink)}
.bar select{background:#3d3830;color:var(--paper);border:0;border-radius:8px;padding:7px 8px;font:inherit}
.bar .count{font-family:var(--mono);font-size:12px;color:#cfc4ae}

/* layout */
.wrap{max-width:1880px;margin:0 auto;padding:18px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr) var(--pw);gap:24px;align-items:start}
body.pclosed .wrap{grid-template-columns:minmax(0,1fr)}
body.pclosed .panel{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px 22px;align-items:start}

/* cards */
.card{position:relative;background:rgba(236,227,207,.93);border:1px solid rgba(120,95,50,.25);padding:16px 18px 14px;box-shadow:0 2px 0 rgba(255,255,255,.6) inset,0 8px 18px rgba(70,45,10,.16);transform:rotate(var(--tilt,0deg));transition:transform .2s,box-shadow .2s;cursor:pointer;min-width:0}
.card:hover{transform:rotate(0) translateY(-3px);box-shadow:0 14px 26px rgba(70,45,10,.22)}
.card::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:20px;transform:translateX(-50%) rotate(var(--tape,-3deg));background:var(--tapec,rgba(224,169,46,.55));box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card.sel{outline:3px solid var(--terra);outline-offset:3px;transform:rotate(0)}
.card.mastered{background:rgba(214,228,212,.95)}
.chead{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.qn{font-family:var(--serif);font-size:44px;line-height:.85;font-weight:700;letter-spacing:-.03em}
.qn small{font-size:.42em;color:var(--terra);font-style:italic;margin-right:1px}
.kicks{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.kicker{font-family:var(--sans);font-variant:small-caps;letter-spacing:.12em;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.kicker svg.i{width:14px;height:14px}
.type{display:inline-block;align-self:flex-start;font-family:var(--cond);text-transform:uppercase;font-size:11px;letter-spacing:.12em;padding:2px 7px;border:1.5px solid currentColor;transform:rotate(-2deg)}
.t-Single{color:var(--sky)} .t-TF{color:var(--jade)} .t-C2{color:var(--terra)} .t-C3{color:#9a4fa0}
.badges{display:flex;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:12px}
.badge.w{color:var(--terra)} .badge.m{color:var(--jade)}
.badge svg.i{width:16px;height:16px}
.qtext{font-size:15.5px;line-height:1.45;margin:0 0 10px}
pre.code{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:#1f1d1a;color:#efe6d2;padding:10px 12px;border-radius:4px;overflow:auto;margin:8px 0 10px;white-space:pre;box-shadow:inset 0 0 0 1px #000}
pre.code.ex{border-left:4px solid var(--mustard)}
.k-str{color:#e6c07b}.k-com{color:#8f8a7e;font-style:italic}.k-cmd{color:#9fd3a8}.k-err{color:#f08a6e}.k-add{color:#9fd3a8}.k-del{color:#f08a6e}.k-chg{color:#e6c07b}.k-ok{color:#9fd3a8;font-weight:600}.k-kw{color:#8fb8e0}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--rule);background:rgba(255,250,240,.35);padding:7px 9px;border-radius:3px;font-family:var(--body);font-size:14px;line-height:1.35;min-width:0}
.opt:hover{border-color:var(--ink2)}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--cond);font-size:13px;font-weight:700}
.opt .tx{min-width:0;flex:1}
.opt pre.code{margin:0;font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.opt.pick{border-color:var(--sky);background:rgba(111,159,200,.15)} .opt.pick .l{background:var(--sky);color:#fff;border-color:var(--sky)}
.opt.ok{border-color:var(--jade);background:rgba(63,127,95,.16)} .opt.ok .l{background:var(--jade);color:#fff;border-color:var(--jade)}
.opt.bad{border-color:var(--terra);background:rgba(196,98,63,.14)} .opt.bad .l{background:var(--terra);color:#fff;border-color:var(--terra)}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--sans);font-size:12.5px;min-height:30px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 11px;border-radius:999px;font-family:var(--sans);font-size:12.5px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.verdict{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.verdict.ok{color:var(--jade)} .verdict.bad{color:var(--terra)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:rgba(236,227,207,.92);font-style:italic}

/* panel */
.panel{position:sticky;top:58px;max-height:calc(100vh - 74px);overflow:auto;background:rgba(236,227,207,.98);border-left:3px double var(--ink);box-shadow:0 10px 28px rgba(60,40,10,.2);padding:0 0 30px}
.ph{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 18px 10px;border-bottom:1px solid var(--ink)}
.ph .qn{font-size:52px}
.ph .kicks{gap:4px}
.ph .tools{display:flex;gap:4px}
.ph .tools .ib{color:var(--ink)}
.ph .tools .ib:hover{background:#ece2ca}
.ph .tools .ib.on{background:var(--jade);color:#fff}
.pb{padding:14px 22px}
.sec{margin:20px 0 0;padding-top:12px;border-top:1px solid var(--rule)}
.sec h3{margin:0 0 8px;font-family:var(--sans);font-variant:small-caps;letter-spacing:.16em;font-size:13px;color:var(--terra);display:flex;align-items:center;gap:6px;font-weight:700}
.answer{display:flex;flex-direction:column;gap:6px}
.pull{margin:18px 0 6px;padding:10px 0 10px 18px;border-left:5px solid var(--terra);font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.25;color:var(--ink)}
.pull::before{content:"\201C";color:var(--terra);font-size:1.6em;line-height:0;vertical-align:-.3em;margin-right:2px}
.expl{font-size:15.5px;line-height:1.6;margin:0}
.expl::first-letter{float:left;font-family:var(--serif);font-size:58px;line-height:.82;padding:6px 8px 0 0;color:var(--jade);font-weight:700}
.wrongs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.45}
.wrongs li{display:flex;gap:9px}
.wrongs .l{flex:none;width:22px;height:22px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-size:12px;font-weight:700;margin-top:1px}
.debate{background:rgba(224,169,46,.18);border:1.5px dashed var(--mustard);padding:10px 12px;font-size:14px;line-height:1.5;display:flex;gap:9px}
.debate svg.i{color:#a77612;margin-top:2px}
.story{font-style:italic;color:var(--ink2);margin:0 0 6px;font-size:14.5px}
.blab{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--sky);color:#2f628f;background:rgba(111,159,200,.12);border-radius:999px;padding:4px 10px;font-family:var(--sans);font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.veil{border:1.5px dashed var(--ink2);padding:22px;text-align:center;background:repeating-linear-gradient(45deg,rgba(224,169,46,.08) 0 10px,transparent 10px 20px)}
.veil p{margin:0 0 12px;font-style:italic;color:var(--ink2)}
.pempty{padding:40px 24px;text-align:center;font-style:italic;color:var(--ink2)}
.pempty .qn{display:block;font-size:80px;color:var(--terra);margin-bottom:10px}

/* responsive */
@media (max-width:1300px){:root{--pw:clamp(360px,40vw,520px)} .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 14px 50px}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:68vh;z-index:30;border-left:0;border-top:3px double var(--ink);box-shadow:0 -10px 30px rgba(0,0,0,.3)}
  .mast{margin-top:0;padding:12px 16px 8px} .mast .stamp{display:none} .mast .kick span:nth-child(2){display:none}
  .panel{background:var(--paper);max-height:60vh} .bar .count{display:none}
  body:not(.pclosed) .wrap{padding-bottom:62vh}
  .bar{padding:8px 12px}
  .grid{grid-template-columns:minmax(0,1fr);gap:22px}
}

/* dark cards theme */
.mast,.card,.panel,.empty,.ph{--ink:#ece3d0;--ink2:#c9bea8;--muted:#9a8f7c;--rule:#4a443b;--paper:#24211d;--terra:#e2825d;--jade:#68b48e;--sky:#8fbbe0;--mustard:#e8b84a;color:var(--ink)}
.mast{background:rgba(32,29,25,.94);border-top-color:var(--terra)}
.mast .stamp{background:rgba(32,29,25,.85)}
.card{background:rgba(36,33,29,.95);border-color:rgba(0,0,0,.4);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 22px rgba(0,0,0,.35)}
.card.mastered{background:rgba(30,46,38,.96)}
.opt{background:rgba(255,255,255,.04)}
.opt:hover{background:rgba(255,255,255,.08)}
.panel{background:rgba(30,27,24,.98);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.ph{background:#24211d}
.ph .tools .ib:hover{background:#3a352e}
pre.code{background:#151311;box-shadow:inset 0 0 0 1px #3a352e}
.chip{color:#a9cdee}
.empty{background:rgba(36,33,29,.95)}
@media (max-width:900px){.panel{background:#1e1b18}}
</style>
</head>

<script>
const QS = [{"n": 13, "type": "Single", "topic": "cli", "title": "Interactive expression evaluation", "q": "Which CLI command evaluates Terraform expressions interactively?", "ex": null, "opts": ["terraform console", "terraform env", "terraform validate", "terraform test"], "ans": ["A"], "why": "terraform console opens an interactive REPL loaded with your configuration and current state. You type an expression (a function call, a variable, a resource attribute) and it prints the result. Nothing is planned or changed.", "wrong": {"B": "terraform env is the old, deprecated alias for terraform workspace; it manages workspaces, not expressions.", "C": "terraform validate checks the configuration for errors in one shot; it is not interactive and evaluates nothing for you.", "D": "terraform test runs .tftest.hcl test files; it is a test runner, not a REPL."}, "story": "You are not sure what cidrsubnet() returns for your VPC, so you try it live before writing it into main.tf.", "blocks": [["sh", "$ terraform console\n> var.vpc_cidr\n\"10.0.0.0/16\"\n> cidrsubnet(var.vpc_cidr, 8, 2)\n\"10.0.2.0/24\"\n> upper(\"dev\")\n\"DEV\"\n> [for s in [\"a\",\"b\"] : \"${s}-vnet\"]\n[\n  \"a-vnet\",\n  \"b-vnet\",\n]\n> exit"]], "related": [], "debate": null}, {"n": 25, "type": "Single", "topic": "cli", "title": "What lives in .terraform/", "q": "Which items are normally placed under a working directory's .terraform folder?", "ex": null, "opts": ["Downloaded providers and modules", "The dependency lock file", "The state file", "Root .tf configuration files"], "ans": ["A"], "why": "terraform init downloads provider plugins into .terraform/providers/ and remote modules into .terraform/modules/. It is a local cache you never commit, and init can rebuild it at any time.", "wrong": {"B": ".terraform.lock.hcl sits in the root of the working directory, next to your .tf files (and you DO commit it).", "C": "Local state is terraform.tfstate in the working directory root (or terraform.tfstate.d/ for extra workspaces). With a remote backend, .terraform/terraform.tfstate only caches the backend settings, not your real state.", "D": "Your .tf files are yours; they live in the working directory itself."}, "story": "You run init in a fresh clone, then look at what appeared on disk.", "blocks": [["sh", "$ terraform init\n...\n$ tree -a -L 4\n.\n├── .terraform\n│   ├── modules\n│   │   ├── modules.json\n│   │   └── vpc\n│   └── providers\n│       └── registry.terraform.io\n│           └── hashicorp\n├── .terraform.lock.hcl      <- root, commit this\n├── main.tf\n├── variables.tf\n└── terraform.tfstate        <- root (local backend)"]], "related": [], "debate": null}, {"n": 30, "type": "Single", "topic": "prov", "title": "Two providers in one root module", "q": "Which configuration correctly initializes AWS and Datadog providers in one root module?", "ex": null, "opts": ["provider \"aws\" {\n  profile = var.aws_profile\n  region  = var.aws_region\n}\nprovider \"datadog\" {\n  api_key = var.datadog_api_key\n  app_key = var.datadog_app_key\n}", "provider {\n  \"aws\" { region = var.aws_region }\n  \"datadog\" { api_key = var.datadog_api_key }\n}", "terraform {\n  provider \"aws\" { region = var.aws_region }\n}", "terraform {\n  provider \"aws\" { region = var.aws_region }\n  provider \"datadog\" { api_key = var.datadog_api_key }\n}"], "ans": ["A"], "why": "Each provider is configured with its own top-level provider \"NAME\" { ... } block. You can have as many as you need in one module. (The terraform block is only where you declare required_providers sources and versions.)", "wrong": {"B": "There is no generic provider { } wrapper block; the provider name is the block label.", "C": "provider blocks are not allowed inside the terraform block, and Datadog is missing anyway.", "D": "Same mistake as C: the terraform block only accepts required_providers, backend, cloud, required_version and similar, not provider configurations."}, "story": "A root module that ships metrics to Datadog from AWS resources.", "blocks": [["hcl", "terraform {\n  required_providers {\n    aws     = { source = \"hashicorp/aws\" }\n    datadog = { source = \"DataDog/datadog\" }\n  }\n}\n\nprovider \"aws\" {\n  region = var.aws_region\n}\n\nprovider \"datadog\" {\n  api_key = var.datadog_api_key\n  app_key = var.datadog_app_key\n}"], ["sh", "$ terraform init\nInitializing provider plugins...\n- Finding latest version of hashicorp/aws...\n- Finding latest version of datadog/datadog...\n- Installed hashicorp/aws v5.70.0 (signed by HashiCorp)\n- Installed datadog/datadog v3.46.0 (signed by a HashiCorp partner)"]], "related": [], "debate": null}, {"n": 36, "type": "True/False", "topic": "cli", "title": "Changes after plan: same actions?", "q": "If someone changes a managed object after you run plan, a later plain terraform apply is guaranteed to use the exact same proposed actions.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "A plain terraform apply (with no saved plan file) does not reuse the earlier plan. It refreshes and creates a brand-new plan, so if someone changed the object in the meantime the new plan can differ (fewer, more, or other actions). That is exactly why it asks you to confirm the plan it shows. If you want the exact reviewed actions, save the plan with -out and apply that file; Terraform then refuses it if the state changed (stale plan).", "wrong": {"A": "Nothing guarantees that: the plan is recomputed at apply time against the current real world."}, "story": "You plan to change instance_type, go for coffee, and a teammate resizes the instance in the console.", "blocks": [["sh", "$ terraform plan\n  # aws_instance.web will be updated in-place\n  ~ instance_type = \"t3.micro\" -> \"t3.small\"\nPlan: 0 to add, 1 to change, 0 to destroy.\n\n# ... teammate changes it to t3.small in the console ...\n\n$ terraform apply\naws_instance.web: Refreshing state... [id=i-0abc123def4567890]\n\nNo changes. Your infrastructure matches the configuration.\n\nApply complete! Resources: 0 added, 0 changed, 0 destroyed."]], "related": [303, 46], "debate": null}, {"n": 42, "type": "Choose 2", "topic": "cli", "title": "terraform apply facts (A)", "q": "Which statements about terraform apply are accurate? (Choose two.)", "ex": null, "opts": ["It acts only on infrastructure defined in the current working directory or workspace.", "Specific resources cannot be targeted with this command.", "A provider may require Terraform to destroy and recreate a resource.", "It must be given the output of a separate terraform plan run.", "By default it skips refreshing state to match the current infrastructure."], "ans": ["A", "C"], "why": "apply works on the configuration in the current directory and the currently selected workspace's state. And when an argument can't be changed in place (the provider schema marks it ForceNew, e.g. an AMI on an EC2 instance), the plan shows -/+ destroy-and-recreate.", "wrong": {"B": "You can: terraform apply -target=aws_instance.web (meant for exceptional cases).", "D": "A saved plan is optional; plain terraform apply makes its own plan and asks you to approve it.", "E": "Refresh is ON by default; you turn it off with -refresh=false."}, "story": "You change the AMI of an instance. The provider says ami cannot be updated in place.", "blocks": [["sh", "$ terraform apply\n  # aws_instance.web must be replaced\n-/+ resource \"aws_instance\" \"web\" {\n      ~ ami = \"ami-0aaa111\" -> \"ami-0bbb222\" # forces replacement\n      ~ id  = \"i-0abc123def4567890\" -> (known after apply)\n    }\n\nPlan: 1 to add, 0 to change, 1 to destroy.\n\n$ terraform apply -target=aws_s3_bucket.logs   # targeting IS possible\n╷\n│ Warning: Resource targeting is in effect\n╵"]], "related": [253], "debate": null}, {"n": 46, "type": "Choose 2", "topic": "cli", "title": "Stale saved plan", "q": "A saved execution plan is rejected as stale. Which two actions let you apply the intended changes? (Choose two.)", "ex": "Error: Saved plan is stale\n\nThe given plan file can no longer be applied because the state was changed by another operation after the plan was created.", "opts": ["Create a fresh execution plan with terraform plan and apply the new plan.", "Run terraform apply without the saved execution plan.", "Refresh the current state data using the -refresh-only flag.", "Force the apply command by adding the flag -lock=false.", "Update the current plan file using the terraform state push command."], "ans": ["A", "B"], "why": "A saved plan is tied to the exact state it was made from. Once the state changes, the file is useless. Either make a new plan file and apply that, or run plain terraform apply, which plans fresh and asks you to approve.", "wrong": {"C": "A refresh-only run changes the state again; the old plan file is still stale.", "D": "-lock=false only skips state locking; it does not make a stale plan valid (and is dangerous).", "E": "state push uploads a state file; it cannot edit or revive a plan file."}, "story": "CI made tfplan, then someone else applied another change first.", "blocks": [["sh", "$ terraform apply tfplan\n╷\n│ Error: Saved plan is stale\n│\n│ The given plan file can no longer be applied because the state was changed\n│ by another operation after the plan was created.\n╵\n\n$ terraform plan -out=tfplan      # option A: re-plan...\n$ terraform apply tfplan          # ...and apply the new file\nApply complete! Resources: 0 added, 1 changed, 0 destroyed.\n\n$ terraform apply                 # option B: plan+approve in one go"]], "related": [36, 303], "debate": null}, {"n": 53, "type": "Single", "topic": "cli", "title": "Why -replace", "q": "Why would you use the -replace flag with terraform apply?", "ex": null, "opts": ["You want to force Terraform to destroy a resource on the next apply.", "You want Terraform to ignore a resource on the next apply.", "You want Terraform to destroy all the infrastructure in the workspace.", "You want to force Terraform to destroy and recreate a resource on the next apply."], "ans": ["D"], "why": "-replace=ADDRESS tells Terraform to replace one object (destroy + create, or create-before-destroy if configured) even though the config did not change. It is the modern replacement for terraform taint, e.g. for a VM that is broken inside.", "wrong": {"A": "It does not just destroy; it recreates the resource as well.", "B": "There is no ignore flag; ignoring changes is lifecycle { ignore_changes = [...] }.", "C": "That is terraform destroy."}, "story": "The web VM's disk got corrupted. The config is fine, you just want a fresh one.", "blocks": [["sh", "$ terraform apply -replace=\"aws_instance.web\"\n\n  # aws_instance.web will be replaced, as requested\n-/+ resource \"aws_instance\" \"web\" {\n      ~ id = \"i-0abc123def4567890\" -> (known after apply)\n        # (24 unchanged attributes hidden)\n    }\n\nPlan: 1 to add, 0 to change, 1 to destroy."]], "related": [], "debate": null}, {"n": 58, "type": "Single", "topic": "cli", "title": "What validate catches", "q": "Which configuration consistency error does terraform validate report?", "ex": null, "opts": ["Declaring a resource identifier more than once.", "Differences between local and remote state.", "An out-of-date module.", "A mix of spaces and tabs in configuration files."], "ans": ["A"], "why": "terraform validate checks syntax and internal consistency of the configuration only: wrong attribute names, wrong types, references to things that don't exist, and duplicate declarations like two resource \"aws_instance\" \"web\" blocks. It never talks to state or remote APIs.", "wrong": {"B": "validate does not read state at all, local or remote.", "C": "It does not check registries for newer module versions.", "D": "Whitespace style is terraform fmt's job; tabs are not an error."}, "story": "You copy-paste a resource block and forget to rename it.", "blocks": [["sh", "$ terraform validate\n╷\n│ Error: Duplicate resource \"aws_instance\" configuration\n│\n│   on main.tf line 9:\n│    9: resource \"aws_instance\" \"web\" {\n│\n│ A aws_instance resource named \"web\" was already declared at main.tf:1,1-30.\n│ Resource names must be unique per type in each module.\n╵"]], "related": [311, 331], "debate": null}, {"n": 61, "type": "Single", "topic": "vars", "title": "Required output argument", "q": "Which argument is required when declaring a Terraform output value?", "ex": null, "opts": ["default", "value", "description", "sensitive"], "ans": ["B"], "why": "An output block needs exactly one required argument: value, the expression whose result you export. description, sensitive, depends_on and precondition are optional.", "wrong": {"A": "default belongs to variable blocks, not outputs.", "C": "description is optional (but nice to have).", "D": "sensitive is optional; it only hides the value from CLI output."}, "story": "Exporting an instance IP.", "blocks": [["hcl", "output \"web_ip\" {\n  value       = aws_instance.web.public_ip   # required\n  description = \"Public IP of web\"           # optional\n}"], ["sh", "$ terraform validate      # with an output that has no value:\n│ Error: Missing required argument\n│\n│ The argument \"value\" is required, but no definition was found."]], "related": [], "debate": null}, {"n": 63, "type": "Single", "topic": "hcl", "title": "Interpolate a data source name", "q": "The virtual network's name must be the resource group name followed by a dash and the word \"vnet\". Which expression meets the requirement?", "ex": "data \"azurerm_resource_group\" \"example\" {\n  name = var.resource_group_name\n}\n\nresource \"azurerm_virtual_network\" \"example\" {\n  name = ____________________\n}", "opts": ["\"${azurerm_resource_group.example.name}-vnet\"", "join(\"-\", var.resource_group_name, \"vnet\")", "concat(data.azurerm_resource_group.example.name, \"-\", \"vnet\")", "\"${data.azurerm_resource_group.example.name}-vnet\""], "ans": ["D"], "why": "The resource group is read with a data block, so its address starts with data.: data.azurerm_resource_group.example.name. String interpolation \"${...}-vnet\" glues the dash and word on.", "wrong": {"A": "Missing the data. prefix; azurerm_resource_group.example would be a managed resource that is not declared.", "B": "join() takes a separator and ONE list: join(\"-\", [var.resource_group_name, \"vnet\"]). Passing loose strings errors.", "C": "concat() joins lists, not strings."}, "story": "Checking it in the console.", "blocks": [["sh", "$ terraform console\n> data.azurerm_resource_group.example.name\n\"rg-ratrace\"\n> \"${data.azurerm_resource_group.example.name}-vnet\"\n\"rg-ratrace-vnet\"\n> join(\"-\", [\"rg-ratrace\", \"vnet\"])\n\"rg-ratrace-vnet\"\n> concat(\"rg-ratrace\", \"-\", \"vnet\")\n╷\n│ Error: Invalid function argument\n│ Invalid value for \"seqs\" parameter: all arguments must be lists or tuples;\n│ got string."]], "related": [], "debate": null}, {"n": 69, "type": "True/False", "topic": "res", "title": "Does a data block create?", "q": "The configuration shown will create a new AWS instance.", "ex": "data \"aws_instance\" \"web\" {\n  filter {\n    name   = \"tag:Name\"\n    values = [\"web\"]\n  }\n}", "opts": ["True", "False"], "ans": ["B"], "why": "A data block only READS an existing object. data \"aws_instance\" looks up an instance tagged Name=web and exposes its attributes. Creating needs a resource block.", "wrong": {"A": "data sources never create, change or destroy anything."}, "story": "Plan with only that data block.", "blocks": [["sh", "$ terraform plan\ndata.aws_instance.web: Reading...\ndata.aws_instance.web: Read complete after 1s [id=i-0abc123def4567890]\n\nNo changes. Your infrastructure matches the configuration."]], "related": [82, 70], "debate": null}, {"n": 70, "type": "Single", "topic": "res", "title": "Block that manages an object", "q": "Which configuration block manages an infrastructure object whose settings are declared within the block?", "ex": null, "opts": ["data", "locals", "provider", "resource"], "ans": ["D"], "why": "A resource block declares an object Terraform owns: it creates it, updates it to match the arguments in the block, and destroys it.", "wrong": {"A": "data only reads existing objects.", "B": "locals are named expressions; they manage nothing.", "C": "provider configures the plugin (region, credentials), not a specific object."}, "story": "Resource vs data side by side.", "blocks": [["hcl", "resource \"aws_s3_bucket\" \"logs\" {   # Terraform creates & manages this\n  bucket = \"johan-logs\"\n}\n\ndata \"aws_s3_bucket\" \"shared\" {     # Terraform only reads this\n  bucket = \"company-shared\"\n}"]], "related": [69], "debate": null}, {"n": 73, "type": "Single", "topic": "hcl", "title": "Referencing a resource attribute", "q": "How would you reference the name attribute of this resource in HCL?", "ex": "resource \"kubernetes_namespace\" \"example\" {\n  name = \"test\"\n}", "opts": ["resource.kubernetes_namespace.example.name", "data.kubernetes_namespace.name", "kubernetes_namespace.example.name", "kubernetes_namespace.test.name"], "ans": ["C"], "why": "Managed resources are referenced as TYPE.NAME.ATTRIBUTE, using the block labels: kubernetes_namespace.example.name. No resource. prefix.", "wrong": {"A": "There is no resource. prefix in references (only data. for data sources).", "B": "It is a resource, not a data source, and the local name example is missing.", "D": "\"test\" is the value of the attribute, not the block's local name."}, "story": "In the console.", "blocks": [["sh", "$ terraform console\n> kubernetes_namespace.example.name\n\"test\"\n> kubernetes_namespace.test.name\n╷\n│ Error: Reference to undeclared resource\n│ A managed resource \"kubernetes_namespace\" \"test\" has not been declared in\n│ the root module."]], "related": [299], "debate": null}, {"n": 74, "type": "Single", "topic": "prov", "title": "Second region needs an alias", "q": "You need to deploy resources into both us-east-1 and us-west-2 from one configuration. What must you add so a resource can target the us-west-2 region?", "ex": "provider \"aws\" {\n  region = \"us-east-1\"\n}\n\nprovider \"aws\" {\n  region = \"us-west-2\"\n}", "opts": ["resource \"aws_instance\" \"example-us-west-2\" { ami = data.aws_ami.ubuntu.id }", "provider \"aws\" { region = \"us-east-1\" } provider \"aws\" \"west\" { region = \"us-west-2\" }", "provider \"aws_west\" { region = \"us-west-2\" }", "provider \"aws\" { region = \"us-east-1\" } provider \"aws\" { alias = \"west\" region = \"us-west-2\" }"], "ans": ["D"], "why": "Two configurations of the same provider are only allowed if the extra ones have an alias. The un-aliased one is the default; resources pick the other with provider = aws.west.", "wrong": {"A": "A resource name has nothing to do with region; it would still use the default provider.", "B": "provider blocks take one label only; \"west\" as a second label is invalid.", "C": "aws_west is not a provider; Terraform would try to find a provider called aws_west."}, "story": "Without an alias Terraform refuses the config.", "blocks": [["sh", "$ terraform validate\n╷\n│ Error: Duplicate provider configuration\n│\n│   on main.tf line 5:\n│    5: provider \"aws\" {\n│\n│ A default (non-aliased) provider configuration for \"aws\" was already given\n│ at main.tf:1,1-15. If multiple configurations are required, set the \"alias\"\n│ argument for alternative configurations.\n╵"], ["hcl", "provider \"aws\" {\n  alias  = \"west\"\n  region = \"us-west-2\"\n}\n\nresource \"aws_instance\" \"dr\" {\n  provider = aws.west\n  # ...\n}"]], "related": [85, 244], "debate": null}, {"n": 78, "type": "Single", "topic": "vars", "title": "Making a variable optional", "q": "You are writing a reusable configuration and want an optional billing_dept tag so Finance can track team-specific spending. Which variable declaration makes billing_dept optional?", "ex": null, "opts": ["variable \"billing_dept\" { default = \"\" }", "variable \"billing_dept\" { type = optional(string) }", "variable \"billing_dept\" { optional = true }", "variable \"billing_dept\" { type = default }"], "ans": ["A"], "why": "A variable is optional exactly when it has a default. With default = \"\" callers can omit it; without a default Terraform prompts or errors.", "wrong": {"B": "optional() is only valid for attributes inside an object type constraint, e.g. object({ dept = optional(string) }).", "C": "There is no optional argument on variable blocks.", "D": "default is not a type."}, "story": "Plan without passing it.", "blocks": [["hcl", "variable \"billing_dept\" {\n  type    = string\n  default = \"\"\n}\n\nlocals {\n  tags = merge(var.base_tags,\n    var.billing_dept == \"\" ? {} : { BillingDept = var.billing_dept })\n}"], ["sh", "$ terraform plan            # no prompt, uses \"\"\n$ terraform plan -var='billing_dept=finance-ops'"]], "related": [], "debate": null}, {"n": 81, "type": "True/False", "topic": "cli", "title": "Does fmt rewrite files?", "q": "Running terraform fmt without any flags in a directory of Terraform configuration files checks their formatting but never rewrites them.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "Plain terraform fmt DOES rewrite files in place to the canonical style and prints the names of files it changed. Check-only mode is terraform fmt -check (often with -diff) in CI.", "wrong": {"A": "That describes -check, not the default."}, "story": "Messy alignment in main.tf.", "blocks": [["sh", "$ terraform fmt\nmain.tf\n$ git diff --stat\n main.tf | 4 ++--\n\n$ terraform fmt -check      # CI: no rewrite, exit 3 if unformatted\nvariables.tf\n$ echo $?\n3"]], "related": [], "debate": null}, {"n": 82, "type": "Single", "topic": "res", "title": "Read an existing resource's ID", "q": "You want to retrieve the ID of an existing cloud resource so you can use it in your configuration. Which block type should you use?", "ex": null, "opts": ["resource", "import", "data", "output"], "ans": ["C"], "why": "To READ something that already exists (and that you don't want Terraform to manage), use a data source and reference data.TYPE.NAME.id.", "wrong": {"A": "A resource block would try to create a new object.", "B": "import brings an object under Terraform management; overkill if you only need its ID.", "D": "output exports values; it does not look anything up."}, "story": "Look up the shared VPC by tag.", "blocks": [["hcl", "data \"aws_vpc\" \"shared\" {\n  tags = { Name = \"shared-vpc\" }\n}\n\nresource \"aws_subnet\" \"app\" {\n  vpc_id     = data.aws_vpc.shared.id\n  cidr_block = \"10.0.5.0/24\"\n}"], ["sh", "data.aws_vpc.shared: Read complete after 0s [id=vpc-0f1e2d3c4b5a69788]"]], "related": [69], "debate": null}, {"n": 84, "type": "Single", "topic": "hcl", "title": "Splitting main.tf into files", "q": "You want to split a large main.tf file into multiple files for better organization within the same working directory. What impact should you expect when you run a terraform plan?", "ex": null, "opts": ["The terraform plan will fail since variable and provider blocks must appear before resource blocks.", "Significant changes should be expected since moving resources between files can trigger a destroy and replacement.", "No impact since Terraform reads all .tf files as a single configuration when executing a terraform plan.", "Only minor impacts since Terraform parses the main.tf file first, which could change the order in which resources are created."], "ans": ["C"], "why": "Terraform loads every .tf file in the directory and merges them into one module. File names and block order don't matter; addresses stay the same, so the plan is empty.", "wrong": {"A": "Block order is irrelevant in HCL.", "B": "Resource addresses don't include file names, so moving a block between files changes nothing.", "D": "main.tf is not special; ordering comes from the dependency graph, not files."}, "story": "Refactor into network.tf, compute.tf, variables.tf.", "blocks": [["sh", "$ ls\ncompute.tf  network.tf  outputs.tf  providers.tf  variables.tf\n$ terraform plan\n...\nNo changes. Your infrastructure matches the configuration."]], "related": [], "debate": null}, {"n": 85, "type": "Single", "topic": "prov", "title": "Pick the aliased provider (A)", "q": "You need to deploy resources into two different regions from the same configuration. Using the provider configurations in the exhibit, which meta-argument deploys a resource to the us-west-2 region?", "ex": "provider \"aws\" {\n  region = \"us-east-1\"\n}\n\nprovider \"aws\" {\n  alias  = \"west\"\n  region = \"us-west-2\"\n}", "opts": ["provider = west", "provider = aws.west", "alias = aws.west", "alias = west"], "ans": ["B"], "why": "Inside a resource you choose a non-default provider with the provider meta-argument, using <PROVIDER>.<ALIAS>: provider = aws.west. alias is only set in the provider block.", "wrong": {"A": "The provider name prefix is missing; Terraform expects aws.west.", "C": "alias is not a resource meta-argument.", "D": "Same as C."}, "story": "Disaster-recovery bucket in the west.", "blocks": [["hcl", "resource \"aws_s3_bucket\" \"dr\" {\n  provider = aws.west\n  bucket   = \"johan-dr-usw2\"\n}"], ["sh", "$ terraform state show aws_s3_bucket.dr | grep region\n    region = \"us-west-2\""]], "related": [244, 74], "debate": null}, {"n": 88, "type": "Choose 2", "topic": "hcl", "title": "List of ids from objects (A)", "q": "You have declared a variable called var.list, which is a list of objects that all have an attribute id. Which expressions evaluate to a list of the objects' id attributes? (Choose two.)", "ex": null, "opts": ["[ var.list[*].id ]", "[ for o in var.list : o.id ]", "var.list[*].id", "{ for o in var.list : o => o.id }"], "ans": ["B", "C"], "why": "The splat var.list[*].id and the for expression [ for o in var.list : o.id ] are equivalent: both return [\"a\",\"b\",...].", "wrong": {"A": "Wrapping the splat in [ ] gives a list containing a list: [[\"a\",\"b\"]].", "D": "Braces produce a map, not a list, and objects can't be map keys anyway (keys must be strings), so it errors."}, "story": "Try all four in the console.", "blocks": [["sh", "$ terraform console\n> var.list\n[\n  { \"id\" = \"a1\" },\n  { \"id\" = \"b2\" },\n]\n> var.list[*].id\n[\n  \"a1\",\n  \"b2\",\n]\n> [ for o in var.list : o.id ]\n[\n  \"a1\",\n  \"b2\",\n]\n> [ var.list[*].id ]\n[\n  [\n    \"a1\",\n    \"b2\",\n  ],\n]\n> { for o in var.list : o => o.id }\n╷\n│ Error: Invalid object key\n│ The key expression produced an invalid result: string required."]], "related": [243, 203], "debate": null}, {"n": 91, "type": "Single", "topic": "vars", "title": "What doesn't keep secrets out of config", "q": "Which option does not keep secret variable values out of Terraform configuration files?", "ex": null, "opts": ["Pass the secret values as environment variables.", "Configure the variable as sensitive.", "Pass the secret values via a -var flag.", "Store the secrets in a shared credential file."], "ans": ["B"], "why": "sensitive = true only REDACTS the value in plan/apply output. It does nothing about where the value comes from; if you hard-code it in a .tf or default, it's still in your files (and it's still written to state). The other three all supply the value from outside the .tf files.", "wrong": {"A": "TF_VAR_db_password=... keeps it out of files.", "C": "-var='db_password=...' supplies it at run time (beware shell history, but not in config).", "D": "e.g. ~/.aws/credentials keeps provider credentials outside the configuration."}, "story": "sensitive hides output, but a hard-coded default is still in Git.", "blocks": [["hcl", "variable \"db_password\" {\n  type      = string\n  sensitive = true\n  default   = \"hunter2\"   # still committed to Git!\n}"], ["sh", "$ export TF_VAR_db_password='from-vault'   # better: value never in .tf\n$ terraform plan\n      + password = (sensitive value)"]], "related": [327, 117], "debate": null}, {"n": 100, "type": "Single", "topic": "mod", "title": "Expose a child module value", "q": "You are updating a child module with the resource block shown in the exhibit. The public_ip attribute of the resource must be accessible to the parent module. What should you do to meet this requirement?", "ex": "resource \"aws_instance\" \"example\" {\n  ami           = \"ami-0a123456789abcdef\"\n  instance_type = \"t3.micro\"\n}", "opts": ["Add a data source to the parent module.", "Create a local value in the child module.", "Add an import block to the parent module.", "Create an output in the child module."], "ans": ["D"], "why": "Modules are encapsulated: the parent can only see what the child exports through output blocks. Add output \"public_ip\" in the child and reference module.<name>.public_ip in the parent.", "wrong": {"A": "A data source would query the cloud again; it's not how modules share values.", "B": "locals are private to the module that declares them.", "C": "import adopts existing infrastructure; unrelated."}, "story": "Child exports, parent consumes.", "blocks": [["hcl", "# modules/web/outputs.tf\noutput \"public_ip\" {\n  value = aws_instance.example.public_ip\n}\n\n# root main.tf\nmodule \"web\" { source = \"./modules/web\" }\noutput \"web_ip\" { value = module.web.public_ip }"], ["sh", "$ terraform output web_ip\n\"54.201.10.12\""]], "related": [235], "debate": null}, {"n": 105, "type": "Single", "topic": "mod", "title": "Pin a module version", "q": "Which argument can you set on a module block to prevent Terraform from updating the module's configuration during an init or get operation?", "ex": null, "opts": ["count", "lifecycle", "source", "version"], "ans": ["D"], "why": "For registry modules, version = \"x.y.z\" (or a constraint) pins which release init/get may download. With an exact version, terraform init -upgrade still can't pull a newer one.", "wrong": {"A": "count controls how many instances of the module, not which code.", "B": "lifecycle is a resource meta-argument, not valid on module blocks.", "C": "source says WHERE the module comes from, not which version (except a ?ref= on Git sources)."}, "story": "Pinning the VPC module.", "blocks": [["hcl", "module \"vpc\" {\n  source  = \"terraform-aws-modules/vpc/aws\"\n  version = \"5.13.0\"\n}"], ["sh", "$ terraform init -upgrade\nInitializing modules...\nDownloading registry.terraform.io/terraform-aws-modules/vpc/aws 5.13.0 for vpc..."]], "related": [317], "debate": null}, {"n": 117, "type": "True/False", "topic": "state", "title": "Sensitive outputs in state", "q": "Terraform stores the value of an output in its state file, even if the sensitive argument is set to true.", "ex": null, "opts": ["True", "False"], "ans": ["A"], "why": "True. sensitive = true only hides the value in CLI output (it shows <sensitive>). The plaintext value is still written to state, which is why state must be protected (encrypted remote backend, access control).", "wrong": {"B": "sensitive is a display feature, not encryption or exclusion."}, "story": "The value is hidden on screen, but not in state.", "blocks": [["sh", "$ terraform output\ndb_password = <sensitive>\n$ terraform output -raw db_password\ns3cr3t-P@ss\n$ terraform state pull | jq '.outputs.db_password'\n{\n  \"value\": \"s3cr3t-P@ss\",\n  \"type\": \"string\",\n  \"sensitive\": true\n}"]], "related": [134, 91], "debate": null}, {"n": 134, "type": "Choose 2", "topic": "state", "title": "Excluded from state", "q": "Which values does Terraform exclude from the state file? (Choose two.)", "ex": null, "opts": ["Data sources", "Ephemeral resources", "Resource attributes", "Write-only arguments", "Sensitive outputs"], "ans": ["B", "D"], "why": "Ephemeral resources (Terraform 1.10+) and write-only arguments (1.11+, e.g. password_wo) exist precisely so secrets never land in plan or state files. Everything else, including data source results and sensitive outputs, IS stored.", "wrong": {"A": "Data source results are saved in state (mode \"data\").", "C": "Resource attributes are the main content of state.", "E": "Sensitive outputs are stored in plaintext; only display is redacted."}, "story": "Fetch a secret ephemerally and pass it to a write-only argument.", "blocks": [["hcl", "ephemeral \"aws_secretsmanager_secret_version\" \"db\" {\n  secret_id = \"prod/db\"\n}\n\nresource \"aws_db_instance\" \"main\" {\n  # ...\n  password_wo         = ephemeral.aws_secretsmanager_secret_version.db.secret_string\n  password_wo_version = 1\n}"], ["sh", "$ terraform state pull | jq '.resources[] | {mode, type}'\n{ \"mode\": \"data\",    \"type\": \"aws_vpc\" }        <- data source: stored\n{ \"mode\": \"managed\", \"type\": \"aws_db_instance\" } <- password_wo: null\n# no ephemeral.* entries at all"]], "related": [117], "debate": null}, {"n": 138, "type": "Single", "topic": "state", "title": "When to run refresh-only", "q": "When do you need to explicitly execute Terraform in refresh-only mode?", "ex": null, "opts": ["Before every terraform plan.", "Before every terraform apply.", "Before every terraform import.", "None of the above."], "ans": ["D"], "why": "plan and apply already refresh by default, so you never NEED a separate refresh-only run before them. Use -refresh-only when you only want to review and accept drift into state without changing infrastructure. Import doesn't need it either.", "wrong": {"A": "plan refreshes on its own.", "B": "apply refreshes on its own.", "C": "import reads the object itself."}, "story": "Someone added a tag by hand; you just want state to know.", "blocks": [["sh", "$ terraform apply -refresh-only\n\nNote: Objects have changed outside of Terraform\n\n  # aws_instance.web has changed\n  ~ resource \"aws_instance\" \"web\" {\n      ~ tags = {\n          + \"Owner\" = \"ops\"\n        }\n    }\n\nThis is a refresh-only plan, so Terraform will not take any actions to undo\nthese. If you were expecting these changes then you can apply this plan to\nrecord the updated values in the Terraform state without changing any remote\nobjects."]], "related": [], "debate": null}, {"n": 150, "type": "Single", "topic": "cli", "title": "What destroy does", "q": "What does terraform destroy do?", "ex": null, "opts": ["Deletes all Terraform code files in the working directory but leaves the state file intact.", "Destroys all infrastructure recorded in the Terraform state file.", "Destroys the state file but leaves the infrastructure intact.", "Destroys all infrastructure available in the configured provider."], "ans": ["B"], "why": "destroy (same as apply -destroy) plans the deletion of every object tracked in the current workspace's state, and removes them after you confirm. Your .tf files and anything Terraform doesn't manage are untouched.", "wrong": {"A": "It never touches your code.", "C": "It deletes real infrastructure; the state then becomes empty.", "D": "Objects not in state (made by others/by hand) are not touched."}, "story": "Tearing down a dev workspace.", "blocks": [["sh", "$ terraform destroy\n  # aws_instance.web will be destroyed\n  - resource \"aws_instance\" \"web\" { ... }\n\nPlan: 0 to add, 0 to change, 3 to destroy.\n\nDo you really want to destroy all resources?\n  Enter a value: yes\n\nDestroy complete! Resources: 3 destroyed."]], "related": [], "debate": null}, {"n": 153, "type": "Choose 2", "topic": "res", "title": "import block required values", "q": "Which values are required by an import block? (Choose two.)", "ex": null, "opts": ["backend", "The target resource address", "provider", "The resource ID"], "ans": ["B", "D"], "why": "An import block needs to (the resource address in your config) and id (the provider's ID for the real object). provider is optional (only for aliased providers); backend has nothing to do with it.", "wrong": {"A": "backend lives in the terraform block, not import.", "C": "provider is an optional argument of import."}, "story": "Adopt a hand-made instance.", "blocks": [["hcl", "import {\n  to = aws_instance.web\n  id = \"i-0abc123def4567890\"\n}"], ["sh", "$ terraform plan -generate-config-out=generated.tf\naws_instance.web: Preparing import... [id=i-0abc123def4567890]\naws_instance.web: Refreshing state... [id=i-0abc123def4567890]\n\nPlan: 1 to import, 0 to add, 0 to change, 0 to destroy."]], "related": [261], "debate": "Since Terraform 1.12, an import block can use identity { ... } instead of id for providers that support resource identity, so strictly it's 'to' plus one of id/identity. The exam answer is still B and D."}, {"n": 203, "type": "True/False", "topic": "hcl", "title": "for_each + splat", "q": "You can reference a resource created with for_each using a splat (*) expression.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "False. A for_each resource is a MAP of instances (keyed by your keys), and splat [*] only works on lists. HashiCorp's docs say directly that you can't use splat with for_each resources. Use values(...)[*] or a for expression instead.", "wrong": {"A": "Splat works on count resources (which are lists), not for_each."}, "story": "Trying to output all IDs.", "blocks": [["sh", "$ terraform plan\n╷\n│ Error: Unsupported attribute\n│\n│   on outputs.tf line 2, in output \"ids\":\n│    2:   value = aws_instance.web[*].id\n│\n│ This object does not have an attribute named \"id\".\n╵"], ["hcl", "output \"ids\" {\n  value = values(aws_instance.web)[*].id\n  # or: [for k, v in aws_instance.web : v.id]\n}"]], "related": [88], "debate": null}, {"n": 232, "type": "Single", "topic": "backend", "title": "Backend & which commands", "q": "A Terraform backend determines how Terraform loads state and stores updates when you execute which command?", "ex": null, "opts": ["apply", "destroy", "Both of these are correct.", "Neither of these are correct."], "ans": ["C"], "why": "Every command that reads or writes state goes through the backend: plan, apply, destroy, import, state ... So both apply and destroy load and store state via the backend.", "wrong": {"A": "True but incomplete.", "B": "True but incomplete.", "D": "The backend is exactly what loads/stores state."}, "story": "S3 backend used by both.", "blocks": [["hcl", "terraform {\n  backend \"s3\" {\n    bucket       = \"johan-tfstate\"\n    key          = \"prod/terraform.tfstate\"\n    region       = \"ap-southeast-2\"\n    use_lockfile = true\n  }\n}"], ["sh", "$ terraform destroy\nAcquiring state lock. This may take a few moments...\n...\nReleasing state lock. This may take a few moments..."]], "related": [270], "debate": null}, {"n": 235, "type": "Single", "topic": "mod", "title": "Undeclared module output", "q": "You are using a networking module in your Terraform configuration with the name my_network. Your root module includes the configuration shown in the exhibit, and running terraform validate produces the error shown. What must you do to successfully retrieve this value from your networking module?", "ex": "output \"vnet_id\" {\n  value = module.my_network.vnet_id\n}\n\nError: Reference to undeclared output value\n  on main.tf line 12, in output \"vnet_id\":\n  12:   value = module.my_network.vnet_id", "opts": ["Define the attribute vnet_id as a variable in the networking module.", "Change the referenced value to my_network.outputs.vnet_id.", "Change the referenced value to module.my_network.outputs.vnet_id.", "Define the attribute vnet_id as an output in the networking module."], "ans": ["D"], "why": "The reference syntax module.my_network.vnet_id is already correct. The error means the child module never exported vnet_id. Add output \"vnet_id\" inside the networking module.", "wrong": {"A": "A variable is an input to the module, not something the parent can read out.", "B": "Invalid syntax (missing module. prefix, and no .outputs).", "C": "There is no .outputs segment in module references."}, "story": "Fix inside the child module.", "blocks": [["hcl", "# modules/network/outputs.tf\noutput \"vnet_id\" {\n  value = azurerm_virtual_network.main.id\n}"], ["sh", "$ terraform validate\nSuccess! The configuration is valid."]], "related": [100], "debate": null}, {"n": 243, "type": "Choose 2", "topic": "hcl", "title": "List of ids from objects (B)", "q": "You have declared a variable named var.list as a list of objects that all have an id attribute. Which options produce a list of the IDs? (Choose two.)", "ex": null, "opts": ["[ for o in var.list : o.id ]", "var.list[*].id", "[ var.list[*].id ]", "{ for o in var.list : o => o.id }"], "ans": ["A", "B"], "why": "Same question as Q88 with the letters shuffled. The for expression in [ ] and the splat var.list[*].id both give a flat list of ids.", "wrong": {"C": "Extra brackets: a list inside a list.", "D": "Braces build a map (and object keys are invalid)."}, "story": "Watch the letters: the correct pair is A+B here, B+C in Q88.", "blocks": [["sh", "$ terraform console\n> [ for o in var.list : o.id ]\n[\n  \"a1\",\n  \"b2\",\n]\n> var.list[*].id\n[\n  \"a1\",\n  \"b2\",\n]\n> length([ var.list[*].id ])\n1"]], "related": [88], "debate": null}, {"n": 244, "type": "Single", "topic": "prov", "title": "Pick the aliased provider (B)", "q": "You must deploy resources into two different regions in the same Terraform configuration, so you declare multiple provider configurations as shown in the exhibit. Which meta-argument do you configure in a resource block to deploy the resource to the us-west-2 AWS region?", "ex": "provider \"aws\" {\n  region = \"us-east-1\"\n}\n\nprovider \"aws\" {\n  alias  = \"west\"\n  region = \"us-west-2\"\n}", "opts": ["provider = west", "alias = west", "provider = aws.west", "alias = aws.west"], "ans": ["C"], "why": "Same as Q85, letters shuffled: provider = aws.west in the resource block.", "wrong": {"A": "Needs the provider-name prefix: aws.west.", "B": "alias belongs in the provider block, not the resource.", "D": "alias is not a resource meta-argument."}, "story": "Also works for modules via a providers map.", "blocks": [["hcl", "resource \"aws_instance\" \"web_west\" {\n  provider      = aws.west\n  ami           = \"ami-0bbb222\"\n  instance_type = \"t3.micro\"\n}\n\nmodule \"dr\" {\n  source    = \"./modules/app\"\n  providers = { aws = aws.west }\n}"]], "related": [85, 74], "debate": null}, {"n": 253, "type": "Choose 2", "topic": "cli", "title": "terraform apply facts (B)", "q": "Which of the following is true about terraform apply? (Choose two.)", "ex": null, "opts": ["You cannot target specific resources for the operation.", "Depending on provider specification, Terraform may need to destroy and recreate your infrastructure resources.", "It only operates on infrastructure defined in the current working directory or workspace.", "By default, it does not refresh your state file to reflect the current infrastructure configuration.", "You must pass the output of a terraform plan command to it."], "ans": ["B", "C"], "why": "Same facts as Q42 in a different order: replacement can be forced by the provider schema, and apply is scoped to the current directory/workspace.", "wrong": {"A": "-target exists.", "D": "Refresh is on by default.", "E": "A saved plan is optional."}, "story": "Workspace scoping in action.", "blocks": [["sh", "$ terraform workspace show\ndev\n$ terraform apply      # only touches dev's state + this directory's config\n...\nApply complete! Resources: 1 added, 0 changed, 0 destroyed."]], "related": [42], "debate": null}, {"n": 254, "type": "Choose 3", "topic": "hcp", "title": "Sentinel benefits", "q": "Which of these are benefits of using Sentinel with HCP Terraform? (Choose three.)", "ex": null, "opts": ["You can check out and check in cloud access keys.", "You can restrict specific resource configurations, such as disallowing the use of CIDR=0.0.0.0/0.", "Sentinel Policies can be written in HashiCorp Configuration Language (HCL).", "You can enforce a list of approved AWS AMIs.", "Policy-as-code can enforce security best practices."], "ans": ["B", "D", "E"], "why": "Sentinel is policy-as-code checked between plan and apply: block open security groups, allow only approved AMIs, enforce tagging and other best practices.", "wrong": {"A": "Checking keys in/out is a secrets manager feature (HashiCorp Vault), not Sentinel.", "C": "Sentinel policies use the Sentinel language (OPA policies use Rego). Only the policy-set config file (sentinel.hcl) is HCL, not the policies."}, "story": "A policy that allows only approved AMIs.", "blocks": [["hcl", "# restrict-ami.sentinel  (Sentinel language, not HCL)\nimport \"tfplan/v2\" as tfplan\n\nallowed_amis = [\"ami-0aaa111\", \"ami-0bbb222\"]\n\nmain = rule {\n  all tfplan.resource_changes as _, rc {\n    rc.type is not \"aws_instance\" or\n    rc.change.after.ami in allowed_amis\n  }\n}"], ["sh", "Policy check: hard-mandatory  restrict-ami ........ FAILED\n  aws_instance.web uses ami-0zzz999 (not allowed)\nRun halted: policy check failed"]], "related": [], "debate": null}, {"n": 255, "type": "Single", "topic": "hcp", "title": "HCP-only feature", "q": "Which of the following is available only in HCP Terraform workspaces and not in Terraform CLI?", "ex": null, "opts": ["Secure variable storage.", "Support for multiple cloud providers.", "Dry runs with terraform plan.", "Using one workspace's state as a data source for another."], "ans": ["A"], "why": "HCP Terraform workspaces store variables (including sensitive, write-only-in-UI ones) encrypted on the platform. The open-source CLI has no built-in variable store; you rely on env vars, files or Vault.", "wrong": {"B": "The CLI supports any provider.", "C": "terraform plan is a CLI command.", "D": "The terraform_remote_state data source works with the CLI and any backend."}, "story": "Variables tab in a workspace.", "blocks": [["sh", "HCP Terraform > johan-lab > rat-race-prod > Variables\n  KEY                 VALUE        CATEGORY   SENSITIVE\n  AWS_SECRET_ACCESS_KEY  ********   env        yes\n  db_password            ** _VAR_log=TRACE."], "ans": ["C"], "why": "TF_LOG turns on logging; TRACE is the most detailed level and shows provider discovery and the paths it loads plugins from.", "wrong": {"A": "There is no generic per-provider verbose setting in config.", "B": "TF_LOG_PATH only chooses the log FILE; by itself it doesn't enable logging.", "D": "TF_VAR_ sets an input variable named log; nothing to do with logging."}, "story": "Where is the AWS plugin coming from?", "blocks": [["sh", "$ TF_LOG=TRACE terraform init 2>&1 | grep -i provider\n2026-10-25T11:02:03.451+1300 [TRACE] providercache.fillMetaCache: scanning directory .terraform/providers\n2026-10-25T11:02:03.452+1300 [TRACE] getproviders.SearchLocalDirectory: found registry.terraform.io/hashicorp/aws v5.70.0 for linux_amd64 at .terraform/providers/registry.terraform.io/hashicorp/aws/5.70.0/linux_amd64\n2026-10-25T11:02:03.452+1300 [TRACE] providercache.fillMetaCache: including .terraform/providers/registry.terraform.io/hashicorp/aws/5.70.0/linux_amd64 as a candidate package for registry.terraform.io/hashicorp/aws 5.70.0\n\n$ TF_LOG=TRACE TF_LOG_PATH=./tf.log terraform plan   # write it to a file"]], "related": [], "debate": null}, {"n": 267, "type": "True/False", "topic": "hcp", "title": "When speculative plans run", "q": "In an HCP Terraform workspace linked to a version control repository, speculative plan runs start automatically when you merge or commit changes to version control.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "False. Speculative (plan-only, can't be applied) runs start when a pull request is opened or updated, so reviewers see the plan as a PR check. A merge or commit to the workspace's tracked branch starts a normal run (plan, then apply after confirmation or auto-apply).", "wrong": {"A": "Merges and commits to the tracked branch trigger real runs, not speculative ones."}, "story": "PR vs merge on the rat-race repo.", "blocks": [["sh", "PR #12 opened  ->  HCP Terraform: speculative plan\n  Status check: Terraform plan: 1 to add, 0 to change, 0 to destroy  [Details]\n  (this run cannot be applied)\n\nPR #12 merged to main  ->  HCP Terraform: run triggered by commit a1b2c3d\n  Plan finished -> Needs confirmation -> Apply"]], "related": [298], "debate": null}, {"n": 270, "type": "Single", "topic": "backend", "title": "Where else state can live", "q": "If you do not use the local Terraform backend, where else can Terraform save resource state?", "ex": null, "opts": ["In an environment variable.", "In memory.", "In a remote location configured in the .terraformrc file, such as HCP Terraform or a cloud storage system.", "In a remote location configured in the terraform block, such as HCP Terraform or a cloud storage system."], "ans": ["D"], "why": "Remote state is configured inside the terraform block with backend \"s3\" / \"azurerm\" / \"gcs\" / ... or a cloud block for HCP Terraform.", "wrong": {"A": "State is never stored in an env var.", "B": "State must persist between runs; memory doesn't.", "C": ".terraformrc is the CLI config file (credentials, plugin cache, provider installation), not where backends are declared."}, "story": "Moving state to Azure storage.", "blocks": [["hcl", "terraform {\n  backend \"azurerm\" {\n    resource_group_name  = \"rg-tfstate\"\n    storage_account_name = \"johantfstate\"\n    container_name       = \"tfstate\"\n    key                  = \"prod.terraform.tfstate\"\n  }\n}"], ["sh", "$ terraform init -migrate-state\nDo you want to copy existing state to the new backend?\n  Enter a value: yes\nSuccessfully configured the backend \"azurerm\"!"]], "related": [232], "debate": null}, {"n": 277, "type": "Single", "topic": "prov", "title": "When the lock file appears", "q": "When does Terraform create the .terraform.lock.hcl file?", "ex": null, "opts": ["After your first terraform plan.", "After your first terraform apply.", "After your first terraform init.", "Whenever you enable state locking."], "ans": ["C"], "why": "terraform init selects provider versions and records them (with checksums) in .terraform.lock.hcl. It's the dependency lock file, about providers, nothing to do with state locking.", "wrong": {"A": "plan needs init to have run first and doesn't create the lock file.", "B": "Same.", "D": "State locking is a backend feature; different 'lock'."}, "story": "First init in a new directory.", "blocks": [["sh", "$ terraform init\nInitializing provider plugins...\n- Installed hashicorp/aws v5.70.0 (signed by HashiCorp)\n\nTerraform has created a lock file .terraform.lock.hcl to record the provider\nselections it made above. Include this file in your version control repository\nso that Terraform can guarantee to make the same selections by default when\nyou run \"terraform init\" in the future."]], "related": [25], "debate": null}, {"n": 279, "type": "Single", "topic": "res", "title": "Removed resource block", "q": "You have a Terraform configuration that defines a single virtual machine with no references to it. You have run terraform apply to create the resource, and then you removed the resource definition from your Terraform configuration file. What will happen when you run terraform apply in the working directory again?", "ex": null, "opts": ["Terraform will destroy the virtual machine.", "Terraform will remove the virtual machine from the state file, but the resource will still exist.", "Terraform will error.", "Nothing."], "ans": ["A"], "why": "Configuration is the desired state. The VM is in state but no longer in config, so Terraform plans to destroy it. (To stop managing it without destroying, use a removed block with lifecycle { destroy = false } or terraform state rm.)", "wrong": {"B": "That is what a removed block with destroy = false does, not plain removal.", "C": "Nothing references it, so there's no error.", "D": "State and config differ, so there's a change."}, "story": "Delete the block and apply.", "blocks": [["sh", "$ terraform apply\n  # azurerm_linux_virtual_machine.vm will be destroyed\n  # (because azurerm_linux_virtual_machine.vm is not in configuration)\n  - resource \"azurerm_linux_virtual_machine\" \"vm\" { ... }\n\nPlan: 0 to add, 0 to change, 1 to destroy."], ["hcl", "# keep the VM, just forget it:\nremoved {\n  from = azurerm_linux_virtual_machine.vm\n  lifecycle {\n    destroy = false\n  }\n}"]], "related": [], "debate": null}, {"n": 283, "type": "Choose 3", "topic": "backend", "title": "Blocked by a state lock", "q": "Which of these actions are forbidden while the Terraform state file is locked? (Choose three.)", "ex": null, "opts": ["terraform apply", "terraform plan", "terraform fmt", "terraform destroy", "terraform state list", "terraform validate"], "ans": ["A", "B", "D"], "why": "Commands that need to lock state wait/fail while someone else holds the lock: apply, destroy and plan (plan takes a lock by default while it reads and refreshes). fmt and validate never touch state, and state list is a read-only command that doesn't take a lock.", "wrong": {"C": "fmt only rewrites .tf files.", "E": "state list just reads state; it doesn't acquire the lock.", "F": "validate only checks configuration."}, "story": "A teammate's apply is running.", "blocks": [["sh", "$ terraform plan\n╷\n│ Error: Error acquiring the state lock\n│\n│ Error message: ConditionalCheckFailedException: The conditional request failed\n│ Lock Info:\n│   ID:        9db590f1-b6fe-c5f2-2678-8804f089deba\n│   Path:      johan-tfstate/prod/terraform.tfstate\n│   Operation: OperationTypeApply\n│   Who:       alice@laptop\n│   Version:   1.13.4\n│\n│ Terraform acquires a state lock to protect the state from being written\n│ by multiple users at the same time. Please resolve the issue above and try\n│ again. For most commands, you can disable locking with the \"-lock=false\"\n│ flag, but this is not recommended.\n╵\n$ terraform state list      # still works\naws_instance.web\n$ terraform fmt && terraform validate\nSuccess! The configuration is valid."]], "related": [], "debate": "plan can be run with -lock=false, so it is only 'forbidden' by default. The exam answer is apply, plan and destroy."}, {"n": 285, "type": "True/False", "topic": "prov", "title": "Providers inside core binary?", "q": "Terraform providers are part of the Terraform core binary.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "False. Providers are separate plugin binaries that terraform init downloads (from the Registry or a mirror) and Terraform core talks to over RPC. That's why they have their own versions and release cycles.", "wrong": {"A": "Only core features ship in the terraform binary; there is one built-in provider (terraform_data / terraform), the rest are plugins."}, "story": "Providers are separate executables.", "blocks": [["sh", "$ ls .terraform/providers/registry.terraform.io/hashicorp/aws/5.70.0/linux_amd64/\nLICENSE.txt  terraform-provider-aws_v5.70.0_x5\n$ terraform version\nTerraform v1.13.4\non linux_amd64\n+ provider registry.terraform.io/hashicorp/aws v5.70.0"]], "related": [294], "debate": null}, {"n": 294, "type": "Single", "topic": "prov", "title": "Not a provider's job", "q": "Which of the following is a Terraform provider not responsible for?", "ex": null, "opts": ["Provisioning infrastructure in multiple cloud providers.", "Managing actions to take based on resource differences.", "Understanding API interactions with a hosted service.", "Managing resources and data sources based on an API."], "ans": ["B"], "why": "Terraform CORE compares config with prior state, builds the graph and decides the actions (create / update / replace / delete). The provider handles authentication, the API calls and defining the resources and data sources for one platform.", "wrong": {"A": "See the debate note: a single provider only talks to its own platform, so this is arguably also not a provider job.", "C": "That's exactly a provider's job.", "D": "Also a provider's job: it defines resources and data sources mapped to an API."}, "story": "Who decides what? Look at the plan.", "blocks": [["sh", "# Terraform core: diff config vs state -> chooses actions\n  # aws_instance.web will be updated in-place\n  ~ resource \"aws_instance\" \"web\" { ... }\n\n# provider plugin: makes the API calls for that action\naws_instance.web: Modifying... [id=i-0abc123def4567890]\naws_instance.web: Modifications complete after 32s"]], "related": [285], "debate": "Genuinely ambiguous. HashiCorp's docs give plan and diff logic to Terraform core, which supports B, and many practice banks key B. But one provider never provisions across MULTIPLE clouds (multi-cloud comes from Terraform using many providers), so some answer keys use A. If your practice tool marked B wrong, the answer it expects is A."}, {"n": 298, "type": "True/False", "topic": "hcp", "title": "cloud block to workspaces", "q": "One cloud block always maps to a single HCP Terraform/Terraform Cloud workspace.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "False. In the cloud block's workspaces { }, you either set name = \"...\" (one workspace) or tags = [...] (every workspace with those tags, switchable with terraform workspace select). With tags, one cloud block maps to many workspaces.", "wrong": {"A": "Only true with name. With tags it maps to several."}, "story": "Tag-based mapping across environments.", "blocks": [["hcl", "terraform {\n  cloud {\n    organization = \"johan-lab\"\n    workspaces {\n      tags = [\"rat-race\"]\n    }\n  }\n}"], ["sh", "$ terraform workspace list\n* rat-race-dev\n  rat-race-prod\n  rat-race-staging\n$ terraform workspace select rat-race-prod"]], "related": [267], "debate": null}, {"n": 299, "type": "Single", "topic": "res", "title": "Reference a data source id", "q": "A configuration is shown in the exhibit. How would you reference an attribute from the vsphere_datacenter data source for use with the datacenter_id argument within the vsphere_folder resource?", "ex": "data \"vsphere_datacenter\" \"dc\" {}\n\nresource \"vsphere_folder\" \"parent\" {\n  path          = \"Production\"\n  type          = \"vm\"\n  datacenter_id = __________________\n}", "opts": ["data.vsphere_datacenter.dc", "vsphere_datacenter.dc.id", "data.dc.id", "data.vsphere_datacenter.dc.id"], "ans": ["D"], "why": "Data sources are referenced as data.TYPE.NAME.ATTRIBUTE, so data.vsphere_datacenter.dc.id.", "wrong": {"A": "That's the whole object, not the id string the argument needs.", "B": "Missing data. prefix (that would be a managed resource).", "C": "Missing the type."}, "story": "Plugging it in.", "blocks": [["hcl", "resource \"vsphere_folder\" \"parent\" {\n  path          = \"Production\"\n  type          = \"vm\"\n  datacenter_id = data.vsphere_datacenter.dc.id\n}"], ["sh", "$ terraform console\n> data.vsphere_datacenter.dc.id\n\"datacenter-3\""]], "related": [73, 63], "debate": null}, {"n": 300, "type": "Choose 2", "topic": "hcp", "title": "HCP Terraform features", "q": "Which of these are features of HCP Terraform/Terraform Cloud? (Choose two.)", "ex": null, "opts": ["Automatic backups of configuration and state.", "A web-based user interface (UI).", "Remote state storage.", "Automated infrastructure deployment visualization."], "ans": ["B", "C"], "why": "HCP Terraform gives you a web UI and remote state storage (with locking and state version history).", "wrong": {"A": "It keeps state versions, but it does not back up your configuration; that lives in your VCS.", "D": "Not a marketed core feature; it shows run logs and plans, not deployment visualization (the exam treats this as a distractor)."}, "story": "What you get after terraform login.", "blocks": [["sh", "$ terraform login\nTerraform will request an API token for app.terraform.io using your browser.\n...\nSuccess! Logged in to HCP Terraform as johan\n\n$ terraform init     # with a cloud block\nHCP Terraform has been successfully initialized!"]], "related": [255], "debate": "State version history can look like rt\n    port              = 443"]], "related": [36, 46, 304], "debate": null}, {"n": 304, "type": "Choose 2", "topic": "state", "title": "Console changes vs state (Azure)", "q": "When using Terraform to deploy resources into Azure, which scenarios are true regarding state files? (Choose two.)", "ex": null, "opts": ["Changing resources via the Azure cloud console records the change in the current state file.", "When you change a resource via the Azure cloud console, Terraform records the changes in a new state file.", "When you change a Terraform-managed resource via the Azure cloud console, Terraform updates the state file to reflect the change during the next plan or apply.", "Changing resources via the Azure cloud console does not update the current state file."], "ans": ["C", "D"], "why": "The portal doesn't know your state exists, so state stays stale until Terraform itself refreshes. The next plan or apply refreshes and detects the drift.", "wrong": {"A": "Azure never writes to your state file.", "B": "No new state file is created; state is only updated by Terraform."}, "story": "Someone tags a resource group in the portal.", "blocks": [["sh", "$ terraform plan\nazurerm_resource_group.rg: Refreshing state... [id=/subscriptions/.../resourceGroups/rg-ratrace]\n\nNote: Objects have changed outside of Terraform\n\n  # azurerm_resource_group.rg has changed\n  ~ resource \"azurerm_resource_group\" \"rg\" {\n      ~ tags = {\n          + \"costcentre\" = \"42\"\n        }\n    }\n..."]], "related": [303], "debate": "Pedantic point: plan only refreshes in memory and doesn't write the state file, while apply (or apply -refresh-only) persists it. The exam still expects C and D."}, {"n": 311, "type": "True/False", "topic": "cli", "title": "validate checks syntax?", "q": "The terraform validate command confirms the syntax of Terraform files.", "ex": null, "opts": ["True", "False"], "ans": ["A"], "why": "True. validate checks that the configuration is syntactically valid and internally consistent (types, references, required arguments), without accessing state or remote services.", "wrong": {"B": "Checking syntax is exactly what it does (plus consistency)."}, "story": "A missing brace.", "blocks": [["sh", "$ terraform validate\n╷\n│ Error: Unclosed configuration block\n│\n│   on main.tf line 1, in resource \"aws_instance\" \"web\":\n│    1: resource \"aws_instance\" \"web\" {\n│\n│ There is no closing brace for this block before the end of the file.\n╵\n# after fixing:\n$ terraform validate\nSuccess! The configuration is valid."]], "related": [58, 331], "debate": null}, {"n": 317, "type": "True/False", "topic": "mod", "title": "Is module version required?", "q": "When you include a module block in your configuration that references a module from the Terraform Registry, the version attribute is required.", "ex": null, "opts": ["True", "False"], "ans": ["B"], "why": "False. version is optional (but recommended). Without it, init installs the newest available version, which can surprise you later.", "wrong": {"A": "Only source is required on a module block."}, "story": "No version: latest gets pulled.", "blocks": [["hcl", "module \"vpc\" {\n  source = \"terraform-aws-modules/vpc/aws\"   # no version: valid\n}"], ["sh", "$ terraform init\nInitializing modules...\nDownloading registry.terraform.io/terraform-aws-modules/vpc/aws 6.5.0 for vpc..."]], "related": [105], "debate": null}, {"n": 327, "type": "Choose 3", "topic": "vars", "title": "Where to store team secrets", "q": "You want to use API tokens and other secrets within your team's Terraform workspaces. Where does HashiCorp recommend you store these sensitive values? (Choose three.)", "ex": null, "opts": ["In a plaintext document on a shared drive.", "In HashiCorp Vault.", "In a terraform.tfvars file checked into your version control system.", "In an HCP Terraform/Terraform Cloud variable with the sensitive option checked.", "In a terraform.tfvars file, securely managed and shared with your team."], "ans": ["B", "D", "E"], "why": "Vault, HCP Terraform sensitive variables, and a tfvars file kept OUT of Git and shared securely are all acceptable ways to supply secrets.", "wrong": {"A": "Plaintext on a shared drive: no access control, no audit.", "C": "Committing secrets to version control is the classic mistake."}, "story": "Keep tfvars out of Git.", "blocks": [["sh", "$ cat .gitignore\n*.tfvars\n*.tfstate*\n.terraform/\n\n$ terraform plan -var-file=secrets.auto.tfvars   # secure local file\n\n# or from Vault:\n$ export TF_VAR_api_token=$(vault kv get -field=token secret/ratrace)"]], "related": [91, 255], "debate": "E (a tfvars file managed securely) can feel risky, but the exam expects B, D and E."}, {"n": 331, "type": "Single", "topic": "cli", "title": "validate: what errors?", "q": "Which syntax check errors when you run terraform validate?", "ex": null, "opts": ["The code contains tabs for indentation instead of spaces.", "There is a missing value for a variable.", "The state file does not match the current infrastructure.", "None of the above."], "ans": ["D"], "why": "None of these cause a validate error. Tabs are style (fmt fixes them). validate doesn't need variable values (it checks types, not supplied values). And it never looks at state or real infrastructure.", "wrong": {"A": "Formatting is fmt's job; tabs are still valid HCL.", "B": "Missing values only matter at plan/apply (prompt or error then).", "C": "validate doesn't read state; drift is found by plan/refresh."}, "story": "Required variable not set, tabs in the file: still valid.", "blocks": [["hcl", "variable \"region\" {\n\ttype = string     # tab-indented, no default, not provided\n}"], ["sh", "$ terraform validate\nSuccess! The configuration is valid.\n\n$ terraform plan\nvar.region\n  Enter a value:"]], "related": [58, 311], "debate": null}];
